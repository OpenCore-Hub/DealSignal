# Local / CI backend stack.
# Project name prefixes containers + volumes (dealsignal_*), avoiding clashes with
# rag-platform_* / vlogbin-test_* volumes on shared Docker hosts.
name: dealsignal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?postgres user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password required}
      POSTGRES_DB: ${POSTGRES_DB:?postgres db required}
    ports:
      # Override POSTGRES_HOST_PORT in .env when 5435 is taken (e.g. rag-platform).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    # Ephemeral — no named volume.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9003}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/minio:latest
    platform: linux/amd64
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-dealsignal}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      /usr/bin/mc mb local/$${S3_BUCKET} || true &&
      /usr/bin/mc anonymous set download local/$${S3_BUCKET}
      "

  onlyoffice:
    image: onlyoffice/documentserver:8.3.3
    platform: linux/amd64
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET required}
    ports:
      - "127.0.0.1:${ONLYOFFICE_HOST_PORT:-8085}:80"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # Reach host-published docling-rag via DOCLING_RAG_BASE_URL=http://host.docker.internal:<port>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Always listen on 8080 inside the container; host publish via API_HOST_PORT.
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-dealsignal}:${POSTGRES_PASSWORD:-dealsignal}@postgres:5432/${POSTGRES_DB:-dealsignal}?sslmode=disable
      REDIS_URL: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9003}
      ONLYOFFICE_URL: http://onlyoffice:80
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8080}
    ports:
      # Override API_HOST_PORT when 8080 is taken (e.g. vlogbin zitadel-proxy).
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      onlyoffice:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
